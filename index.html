<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KosiManthan – Flood Relief & Agricultural Recovery Platform | Bihar</title>
  <meta name="description" content="Integrated technology and logistics platform for Kosi Basin flood early warning, 24-48h pre-flood asset evacuation, AI crop damage verification, and soil recovery." />
  <meta name="theme-color" content="#064e3b" />

  <!-- PWA Manifest & Favicon -->
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%23059669'/><path d='M20 60 C35 45, 65 75, 80 60 C65 50, 35 70, 20 60' fill='%2338bdf8'/><circle cx='50' cy='35' r='14' fill='%23f59e0b'/></svg>" type="image/svg+xml" />

  <!-- Tailwind CSS 3.4 CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#ecfdf5',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
              900: '#064e3b',
              950: '#022c22'
            },
            kosi: {
              water: '#0284c7',
              warning: '#d97706',
              danger: '#dc2626'
            }
          },
          fontFamily: {
            sans: ['Inter', 'Noto Sans Devanagari', 'system-ui', 'sans-serif'],
            heading: ['Outfit', 'Noto Sans Devanagari', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- Leaflet Interactive Maps CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="./src/index.css" />
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen selection:bg-emerald-500 selection:text-white">
  
  <!-- Main Application Container -->
  <div id="app" class="min-h-screen flex flex-col justify-between">
    <!-- Rendered dynamically by src/app.js -->
    <div class="flex items-center justify-center min-h-screen">
      <div class="text-center space-y-3">
        <div class="inline-block w-10 h-10 border-4 border-emerald-500 border-t-transparent rounded-full animate-spin"></div>
        <div class="text-emerald-400 font-bold font-heading text-lg">Initializing KosiManthan Platform...</div>
        <div class="text-slate-500 text-xs">Loading Kosi river telemetry sensors and offline cache</div>
      </div>
    </div>
  </div>

  <!-- Main ES Module Script Entry -->
  <script type="module" src="./src/app.js"></script>

</body>
</html>
